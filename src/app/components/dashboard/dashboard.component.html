<!DOCTYPE html>
<html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
<body>

<canvas id="myChart" style="width:100%;max-width:600px"></canvas>

<script>
const xValues = ["A01", "A02", "A03", "A04", "A05", "A08", "C02", "Cinebeam",];
const yValues = [24, 49, 44, 24, 15, 9, 15, 17 ];
const barColors = [
  "#b91d47",
  "#00aba9",
  "#2b5797",
  "#e8c3b9",
  "#1e7145",
  "#b91d47",
  "#00aba9",
  "#e8c3b9",

];

const xValues2 = ["HDMI", "VGA", "EXTENSÃO USB", "PATCH CORD", "DISPLAYPORT", "HDMI-DVI", "OPTCAL", "Cinebeam",];
const yValues2 = [24, 49, 44, 24, 15, 9, 15, 17 ];

new Chart("myChart", {
  type: "bar",
  data: {
    labels: xValues,
    datasets: [{
      backgroundColor: barColors,
      data: yValues
    }]
  },
  options: {
    legend: {display: false},
    scales: {
      yAxes: [{
        ticks: {
          beginAtZero: true
        }
      }]
    },

    title: {
      display: true,
      text: "Consumo por Linha"
    }
  }
});
</script>

<canvas id="myChart2" style="width:100%;max-width:600px"></canvas>

<script>
new Chart("myChart2", {
  type: "pie",
  data: {
    labels: xValues2,
    datasets: [{
      backgroundColor: barColors,
      data: yValues2
    }]
  },
  options: {
    title: {
      display: true,
      text: "Consumo por Cabos"
    }
  }
});
</script>


</body>
</html>
