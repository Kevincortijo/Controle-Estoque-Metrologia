<div class="Formulario">

    <form>
        <fieldset class="fieldset">
            <legend>Cadastro de Item</legend>

            <div class="cadastro">

                <div class="Nome_item">
                    <label for="Nome">Nome</label><br>
                    <input type="text" [(ngModel)] = "item.name" name="name" class="form-control" id="Nome" placeholder="Nome do Item">
                </div>
          
                <div class="partnumber">
                    <label for="partnumber">Código</label><br>
                    <input type="text" [(ngModel)] = "item.code" name="name" class="codigo" id="partnumber" placeholder="Código do Item">
                </div>

                <div class="quantidade">
                    <label for="quantidade_item">Quantidade</label><br>
                    <input type="number" [(ngModel)] = "item.quantity" name="name" class="number" id="Quantidade" placeholder="0">
                </div>

                <div class="fornecedor">
                    <label for="fornecedor">Fornecedor</label><br>
                    <input type="text" [(ngModel)] = "item.supplier" name="name" class="fornecedor" id="supplier" placeholder="Fornecedor">
                </div>

                <div class="Fabricante">
                    <label for="Fabricante">Fabricante</label><br>
                    <input type="text" [(ngModel)] = "item.manufacturer" name="name" class="Fabricante" id="Maker" placeholder="Fabricante">
                </div>

                <div class="form-group">
                  <label for="valor_item">Preço Unitário</label><br>
                <input type="text" [(ngModel)] = "item.unit_price" name="name" name="valor_item" id="valor_item" placeholder="0,00" oninput="mascaraMoeda(event);"
                    value="R$ ">
                </div>
                

            </div>
            
            
            <div class="descricao">
                <div class="descricao">
                    <label for="descricao_item">Descrição detalhada</label><br>
                    <textarea id="descricao_item" name="observacao" rows="5" cols="33" placeholder="Spec. do item"></textarea>
                </div>
            </div>
            
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                <button type="submit" class="btn btn-secundary">Cancelar</button>
        </fieldset>
    </form>

</div>
