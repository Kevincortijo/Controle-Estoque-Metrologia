<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ControleEstoqueMetrologia</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="lg_free-.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
  
</head>
<body>
  <app-root></app-root>



  <script>
    const xValues = ["A01", "A02", "A03", "A04", "A05", "A08", "C02", "Cinebeam",];
    const yValues = [24, 49, 44, 24, 15, 9, 15, 17 ];
    const barColors = [
      "#b91d47",
      "#00aba9",
      "#2b5797",
      "#e8c3b9",
      "#1e7145",
      "#b91d47",
      "#00aba9",
      "#e8c3b9",

    ];

    
    new Chart("myChart", {
      type: "bar",
      data: {
        labels: xValues,
        datasets: [{
          backgroundColor: barColors,
          data: yValues
        }]
      },
      options: {
        legend: {display: false},
        scales: {
          yAxes: [{
            ticks: {
              beginAtZero: true
            }
          }]
        },

        title: {
          display: true,
          text: "Consumo por Linha"
        }
      }
    });
  </script>



  <script>

    const xValues2 = ["HDMI", "VGA", "EXTENSÃO USB", "PATCH CORD", "DISPLAYPORT", "HDMI-DVI", "OPTCAL", "Cinebeam",];
    const yValues2 = [24, 49, 44, 24, 15, 9, 15, 17 ];

    new Chart("myChart2", {
      type: "pie",
      data: {
        labels: xValues2,
        datasets: [{
          backgroundColor: barColors,
          data: yValues2
        }]
      },
      options: {
        title: {
          display: true,
          text: "Consumo por Cabos"
        }
      }
    });
  </script>

</body>
</html>
